# Credentials for Shareomat — copy to config/secrets.yaml (git-ignored) and fill in.
# On Linux the file must be readable by Shareomat only, otherwise the start is refused:
#   chmod 600 config/secrets.yaml
# Every entry is optional. An environment variable with the same name wins over this file
# (SHAREOMAT_MQTT_PASSWORD, SHAREOMAT_SWISSELDEX_PASSWORD, SHAREOMAT_SMTP_PASSWORD,
#  SHAREOMAT_WAN_PASSWORD, SHAREOMAT_ENTSOE_API_TOKEN). Another location: SHAREOMAT_SECRETS_PATH.
# The Home Assistant add-on writes this file itself from its options (/data/secrets.yaml).

mqtt:
  password: ""
swisseldex:
  password: ""
smtp:
  password: ""      # Gmail: an App Password, never the account password
wan:
  password: ""
entsoe:
  api_token: ""     # or enter it on "Externe Daten" (then it is kept in data/secrets.json)

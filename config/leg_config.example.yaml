# Shareomat runtime configuration — technical settings only.
#
# Gemeinschaft, Teilnehmer, Messpunkte, Tarife und Automatik werden NICHT
# hier eingetragen. Sie werden beim ersten Start über die Shareomat-
# Weboberfläche eingerichtet (Einrichtungsassistent) und in der SQLite-
# Datenbank data/shareomat.db verwaltet.

paths:
  inbox: "data/inbox"
  archive: "data/archive"
  reports: "data/reports"
  state: "data/state"
  share_inbox: ""

mqtt:
  enabled: false
  broker: "localhost"
  port: 1883
  username: ""
  password: ""
  client_id: "shareomat"
  topic_prefix: "shareomat"
  discovery_prefix: "homeassistant"
  discovery_enabled: true
  command_topic_enabled: true
  qos: 1
  retain: true
  tls_enabled: false
  tls_ca_cert: ""

email:
  enabled: false
  imap_host: "imap.gmail.com"
  imap_port: 993
  username: ""
  password: ""
  folder: "INBOX"
  allowed_senders: []
  poll_interval_seconds: 300

web:
  enabled: true
  port: 8099

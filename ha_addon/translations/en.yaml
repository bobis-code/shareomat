configuration:
  paperless_url:
    name: Paperless-ngx (optional)
    description: >-
      Address of Paperless-ngx, e.g. http://homeassistant.local:8000. Signatures, reports and notices
      can then hold document numbers that open as links. Shareomat never calls Paperless itself.
      Leave empty if Paperless is not used.
  sparkplug:
    name: Connection to Emsomat
    description: >-
      Default is "auto": the Emsomat on this Home Assistant is connected automatically.
      Node ID and group only apply with "manual".
    fields:
      mode:
        name: Mode
        description: "auto = automatic, manual = own values below, off = no connection"
      node_id:
        name: Node ID (manual only)
        description: No effect with "auto". Must match the node ID in Emsomat.
      group_id:
        name: Group (manual only)
        description: No effect with "auto". Must match the Sparkplug group in Emsomat.
  swisseldex:
    name: Swisseldex Datahub (SDAT receive)
    description: >-
      Fetches SDAT files from the FTPES mailbox at the Swisseldex Datahub and archives them.
      Nothing is deleted at Swisseldex, nothing is billed. Test and sync under Externe Daten.
    fields:
      enabled:
        name: Enabled
        description: Switch on once username and password are entered, then restart the add-on.
      host:
        name: Server
        description: "Default: datahub.swisseldex.ch"
      port:
        name: Port
        description: "Default: 21 (FTPES, explicit TLS)"
      username:
        name: Username
        description: FTPES username from the Swisseldex portal
      password:
        name: Password
        description: FTPES password from the Swisseldex portal. Not stored in the database.
      auto_sync:
        name: Sync automatically
        description: Leave off until the first manual test succeeded.
      sync_interval_hours:
        name: Interval (hours)
        description: How often to sync automatically. Default 6.
  smtp:
    name: E-mail sending (documents)
    description: >-
      Mailbox Shareomat uses to send invoices, credit notes, cancellation notices, reminders and
      welcome mails with a PDF. Encrypted only. Mails are sent only when you press the button.
    fields:
      enabled:
        name: Enabled
        description: Switch on once everything is entered, restart the add-on, then send a test e-mail under E-Mail-Vorlagen.
      host:
        name: Mail server
        description: "Gmail: smtp.gmail.com"
      port:
        name: Port
        description: "465 with ssl, 587 with starttls"
      security:
        name: Encryption
        description: "ssl (port 465) or starttls (port 587). Unencrypted is not possible."
      username:
        name: Username
        description: Usually the full e-mail address of the mailbox
      password:
        name: Password
        description: Gmail and others with two-factor sign-in need an app password. Not stored in the database.
      from_address:
        name: Sender address
        description: The address recipients see as sender. For Gmail the same as the username.
      from_name:
        name: Sender name (optional)
        description: For example the community's name

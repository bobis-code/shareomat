configuration:
  paperless_url:
    name: Paperless-ngx (optional)
    description: >-
      Adresse von Paperless-ngx, z. B. http://homeassistant.local:8000. Dann lassen sich bei
      Unterschriften, Meldungen und Mitteilungen Dokument-Nummern erfassen und als Link öffnen.
      Shareomat ruft Paperless nie selbst auf. Leer lassen, wenn Paperless nicht genutzt wird.
  sparkplug:
    name: Verbindung zu Emsomat
    description: >-
      Standard ist «auto»: Emsomat auf diesem Home Assistant wird automatisch verbunden.
      Knoten-ID und Gruppe gelten nur bei «manual».
    fields:
      mode:
        name: Modus
        description: "auto = automatisch, manual = eigene Werte unten, off = keine Verbindung"
      node_id:
        name: Knoten-ID (nur bei manual)
        description: Bei «auto» ohne Wirkung. Muss der Knoten-ID in Emsomat entsprechen.
      group_id:
        name: Gruppe (nur bei manual)
        description: Bei «auto» ohne Wirkung. Muss der Sparkplug-Gruppe in Emsomat entsprechen.
  swisseldex:
    name: Swisseldex Datahub (SDAT-Empfang)
    description: >-
      Holt SDAT-Dateien aus dem FTPES-Postfach beim Swisseldex Datahub und archiviert sie.
      Kein Löschen auf Swisseldex, keine Abrechnung. Test und Synchronisation unter Externe Daten.
    fields:
      enabled:
        name: Aktiviert
        description: Einschalten, sobald Benutzername und Passwort eingetragen sind. Danach Add-on neu starten.
      host:
        name: Server
        description: "Standard: datahub.swisseldex.ch"
      port:
        name: Port
        description: "Standard: 21 (FTPES, explizites TLS)"
      username:
        name: Benutzername
        description: FTPES-Benutzername aus dem Swisseldex-Portal
      password:
        name: Passwort
        description: FTPES-Passwort aus dem Swisseldex-Portal. Wird nicht in der Datenbank gespeichert.
      auto_sync:
        name: Automatisch synchronisieren
        description: Nur Startwert. Einfacher unter Externe Daten → Swisseldex umschalten; dort gilt es sofort, ohne Neustart, und hat danach Vorrang vor diesem Feld.
      sync_interval_hours:
        name: Intervall (Stunden)
        description: Nur Startwert, Standard 6. Wird unter Externe Daten → Swisseldex eingestellt und gilt dann von dort.
  smtp:
    name: E-Mail-Versand (Belege)
    description: >-
      Postfach, über das Shareomat Rechnungen, Gutschriften, Stornobelege, Mahnungen und
      Willkommensmails mit PDF sendet. Nur verschlüsselt. Gesendet wird nur auf Knopfdruck.
    fields:
      enabled:
        name: Aktiviert
        description: Einschalten, sobald alles eingetragen ist. Danach Add-on neu starten und unter E-Mail-Vorlagen eine Test-E-Mail senden.
      host:
        name: Mailserver
        description: "Gmail: smtp.gmail.com"
      port:
        name: Port
        description: "465 bei ssl, 587 bei starttls"
      security:
        name: Verschlüsselung
        description: "ssl (Port 465) oder starttls (Port 587). Unverschlüsselt ist nicht möglich."
      username:
        name: Benutzername
        description: Meist die vollständige E-Mail-Adresse des Postfachs
      password:
        name: Passwort
        description: Gmail und andere mit Zwei-Faktor-Anmeldung brauchen ein App-Passwort. Wird nicht in der Datenbank gespeichert.
      from_address:
        name: Absenderadresse
        description: Die Adresse, die Empfänger als Absender sehen. Bei Gmail dieselbe wie der Benutzername.
      from_name:
        name: Absendername (optional)
        description: Zum Beispiel der Name der Gemeinschaft
  command_topic_enabled:
    name: MQTT-Befehl run_once (nicht mehr verwendet)
    description: >-
      Seit 0.6.34 nicht mehr verwendet: Messdaten kommen nur noch vom Netzbetreiber über Swisseldex. Bleibt bis zur neuen Konfiguration bestehen, damit die bisherigen Einstellungen weiter geladen werden.

name: Shareomat
version: "0.4.0"
slug: shareomat
description: LEG/ZEV — calculates local energy sharing.
url: https://github.com/bobis-code/shareomat
startup: application
boot: auto
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
host_network: false
hassio_api: false
homeassistant_api: false

map:
  - config:rw
  - share:rw

services:
  - mqtt:want

# NOTE: Gemeinschaft, Teilnehmer, Messpunkte, Tarife und Automatik werden NICHT
# mehr hier gepflegt, sondern in der Shareomat-Weboberfläche selbst (SQLite-
# Datenbank unter /data/shareomat.db). Diese Optionen sind rein technisch.
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  base_topic: "shareomat"
  discovery_prefix: "homeassistant"
  command_topic_enabled: true
  timezone: "Europe/Zurich"
  log_level: "info"
  mqtt_tls: false
  mqtt_ca_cert: ""
  ingress_enabled: true
  share_inbox: ""
  email_enabled: false
  email_imap_host: "imap.gmail.com"
  email_imap_port: 993
  email_username: ""
  email_password: ""
  email_folder: "INBOX"
  email_allowed_senders: []
  email_poll_interval_seconds: 300

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password?
  base_topic: str
  discovery_prefix: str
  command_topic_enabled: bool
  timezone: str
  log_level: list(debug|info|warning|error)
  mqtt_tls: bool
  mqtt_ca_cert: str
  ingress_enabled: bool
  share_inbox: str
  email_enabled: bool
  email_imap_host: str
  email_imap_port: int
  email_username: str
  email_password: password?
  email_folder: str
  email_allowed_senders:
    - str
  email_poll_interval_seconds: int
